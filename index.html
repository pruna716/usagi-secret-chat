<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>우사기의 비밀대화</title>
<style>
:root{
  --sky1:#dff1ff;
  --sky2:#edf8ff;
  --field:#eff6c6;
  --grass:#c4dd7b;
  --card:#fffdf9;
  --line:#eadfce;
  --brown:#6f472d;
  --brown2:#8c6347;
  --yellow:#ffe784;
  --yellow2:#ffd95e;
  --pink:#ffd7e5;
  --pink2:#ffc4d8;
  --shadow:0 20px 48px rgba(132,116,92,.16);
  --soft:0 8px 20px rgba(132,116,92,.12);
}
*{box-sizing:border-box}
html,body{height:100%}
body{
  margin:0;
  min-height:100vh;
  font-family:system-ui,-apple-system,"Segoe UI","Noto Sans KR",sans-serif;
  color:var(--brown);
  background:
    radial-gradient(circle at 10% 11%, rgba(255,255,255,.95) 0 3%, transparent 3.2%),
    radial-gradient(circle at 90% 14%, rgba(255,255,255,.92) 0 3.4%, transparent 3.6%),
    radial-gradient(circle at 82% 8%, rgba(255,255,255,.9) 0 4.5%, transparent 4.7%),
    radial-gradient(circle at 15% 7%, rgba(255,255,255,.95) 0 4.8%, transparent 5%),
    linear-gradient(180deg,var(--sky1) 0%, var(--sky2) 52%, #f8fbec 76%, var(--field) 100%);
  overflow-x:hidden;
}
body::before{
  content:"";
  position:fixed;
  left:0; right:0; bottom:0;
  height:145px;
  background:
    radial-gradient(circle at 12% 78%, rgba(255,255,255,.95) 0 7px, transparent 8px),
    radial-gradient(circle at 18% 55%, rgba(255,255,255,.95) 0 6px, transparent 7px),
    radial-gradient(circle at 34% 72%, rgba(255,255,255,.95) 0 7px, transparent 8px),
    radial-gradient(circle at 52% 60%, rgba(255,255,255,.95) 0 7px, transparent 8px),
    radial-gradient(circle at 67% 75%, rgba(255,255,255,.95) 0 8px, transparent 9px),
    radial-gradient(circle at 80% 54%, rgba(255,255,255,.95) 0 6px, transparent 7px),
    radial-gradient(circle at 92% 70%, rgba(255,255,255,.95) 0 8px, transparent 9px),
    radial-gradient(circle at 10% 100%, #bdd78d 0 15%, transparent 16%),
    radial-gradient(circle at 90% 100%, #bdd78d 0 15%, transparent 16%),
    linear-gradient(180deg, rgba(0,0,0,0) 0%, #e8f1b6 50%, #dbe996 100%);
  pointer-events:none;
  z-index:0;
}
.wrap{
  width:min(1180px,100%);
  margin:0 auto;
  padding:36px 24px 56px;
  position:relative;
  z-index:1;
}
.hero{
  text-align:center;
  position:relative;
  margin-bottom:22px;
}
.hero .memo-left,
.hero .memo-right{
  position:absolute;
  top:62px;
  font-weight:800;
  color:var(--brown2);
  font-size:15px;
  line-height:1.6;
  white-space:pre-line;
}
.hero .memo-left{left:6px; transform:rotate(-7deg)}
.hero .memo-right{right:6px; transform:rotate(8deg); top:138px}
.title{
  display:inline-flex;
  align-items:center;
  gap:12px;
  flex-wrap:wrap;
  justify-content:center;
}
.hero h1{
  margin:0;
  font-size:clamp(42px,6vw,78px);
  line-height:1.02;
  letter-spacing:-.05em;
  font-weight:900;
}
.hero h1 .y{color:#f2c94c;}
.hero h1 .p{color:#f4a9c2;}
.hero .subtitle{
  margin:14px 0 0;
  color:var(--brown2);
  font-size:20px;
  font-weight:800;
}
.page{
  position:relative;
  padding:0 150px;
}
.bunny-side{
  position:absolute;
  bottom:92px;
  width:180px;
  height:320px;
  background-repeat:no-repeat;
  background-size:contain;
  background-position:center bottom;
  filter:drop-shadow(0 8px 10px rgba(0,0,0,.07));
}

.main-card{
  background:rgba(255,252,246,.93);
  border:1px solid rgba(234,223,206,.95);
  border-radius:34px;
  padding:28px 28px 24px;
  box-shadow:var(--shadow);
  backdrop-filter:blur(5px);
}
.tabs{display:flex;gap:12px;flex-wrap:wrap;margin-bottom:22px}

  border:none;
  border-radius:999px;
  padding:13px 20px;
  font:inherit;
  font-weight:900;
  cursor:pointer;
  color:var(--brown);
  background:#fff;
  box-shadow:0 4px 0 rgba(211,197,179,.95);
  transition:transform .14s ease, box-shadow .14s ease, opacity .14s ease;
}
button:hover{transform:translateY(-1px); box-shadow:0 8px 16px rgba(166,146,120,.18)}
button:active{transform:translateY(1px); box-shadow:0 2px 0 rgba(211,197,179,.95)}
.tab{background:#ffeeb0}
.tab:nth-child(2){background:#ffe4ed}
.tab[data-mode="encode"]::before{content:"💬 ";}
.tab[data-mode="decode"]::before{content:"♡ ";}
.tab.active,.primary{background:linear-gradient(180deg,var(--yellow) 0%, var(--yellow2) 100%)}
.row{display:grid;grid-template-columns:1fr 1fr;gap:22px}
.panel{

  border-radius:26px;
  padding:18px;
  position:relative;
}

  font-size:17px;
  font-weight:900;
  color:#653f2b;
}

#outputLabel::before{content:"🐰 ";}

  position:relative;
  z-index:1;
}

<body>
<div class="wrap">
  <section class="hero">
    <div class="memo-left">우사기랑
오늘도
행복한 하루! ♡</div>
    <div class="title">
      <h1><span class="y">우사기</span><span class="p">의 비밀대화</span></h1>
    </div>
    <p class="subtitle">평범한 말을 우사기만의 귀여운 언어로 바꿔보세요! ♡</p>
    <div class="memo-right">우사기랑
비밀이야! ♡</div>
  </section>

  <div class="page">
    <div class="bunny-side left" aria-hidden="true"></div>
    <div class="bunny-side right" aria-hidden="true"></div>

    <section class="main-card">
      <div class="tabs">
        <button class="tab active" data-mode="encode">텍스트 변환하기</button>
        <button class="tab" data-mode="decode">우사기 언어란?</button>
      </div>

      <div class="row">
        <div class="panel">
          <label id="inputLabel">일반 텍스트</label>
          <textarea id="input" maxlength="40" placeholder="여기에 글을 입력해보세요!"></textarea>
          <div class="counter" id="countWrap"><span id="counter">0</span> / 40</div>
        </div>

        <div class="panel output-wrap">
          <label id="outputLabel">우사기 언어로 변환된 텍스트</label>
          <textarea id="output" readonly placeholder="여기에 결과가 나와"></textarea>
        </div>
      </div>

      <div class="actions">
        <button class="primary" id="go">우사기 언어로 바꾸기</button>
        <button id="copy">결과 복사</button>
        <button id="swap">반대로 바꾸기</button>
        <button id="example">예시 넣기</button>
        <button id="clear">초기화</button>
      </div>

      <div class="status" id="status"></div>
      <div class="footer-note">쥬르리를 제거하고 느낌표 변형을 늘린 32개 우사기 표현을 적용했어요.</div>
    </section>
  </div>
</div>
<script>
// 우사기 언어 v7.1
// - 32개 토큰만 사용
// - 하트(♡/♥), 점(.)/말줄임표(...) 제거
// - 실제 우사기 느낌이 나는 표현 + 자연스러운 변형만 사용
// - UTF-8 바이트를 5bit(Base32) 단위로 매핑
// - 입력 내용/언어/단어에 관계없이 동일 방식으로 왕복 가능

const TOKENS = [
  "야하",
  "야하!",
  "야하!!",
  "우라",
  "우라!",
  "우라!!",
  "푸루야",
  "푸루야!",
  "푸루야!!",
  "푸루",
  "푸루!",
  "푸루!!",
  "우-라-",
  "우-라-!",
  "우-라-!!",
  "하아?",
  "하아!?",
  "하아!!",
  "후응",
  "후응!",
  "후응!!",
  "우라라라라라라라라!",
  "우라라라라라라라라!!",
  "야아아아아앗!",
  "야아아아아앗!!",
  "하아아아아앗!",
  "하아아아아앗!!",
  "야핫",
  "야핫!",
  "야핫!!",
  "야푸",
  "야푸!"
];

const REV = new Map(TOKENS.map((t,i)=>[t,i]));
const te = new TextEncoder();
const td = new TextDecoder("utf-8", {fatal:true});

function bytesTo5(bytes){
  const out = [];
  let acc = 0, bits = 0;

  for(const b of bytes){
    acc = (acc << 8) | b;
    bits += 8;

    while(bits >= 5){
      bits -= 5;
      out.push((acc >> bits) & 31);
      acc &= bits ? ((1 << bits) - 1) : 0;
    }
  }

  if(bits > 0){
    out.push((acc << (5 - bits)) & 31);
  }

  return out;
}

function fiveToBytes(values, expectedLength){
  const out = [];
  let acc = 0, bits = 0;

  for(const v of values){
    acc = (acc << 5) | v;
    bits += 5;

    while(bits >= 8 && out.length < expectedLength){
      bits -= 8;
      out.push((acc >> bits) & 255);
      acc &= bits ? ((1 << bits) - 1) : 0;
    }
  }

  if(out.length !== expectedLength){
    throw Error("우사기 언어가 중간에 끊겼어.");
  }

  return Uint8Array.from(out);
}

function enc(text){
  const payload = te.encode(text);

  // 최대 40자 기준 UTF-8 160바이트 이하.
  if(payload.length > 255){
    throw Error("메시지가 너무 길어.");
  }

  // 첫 1바이트에 실제 UTF-8 바이트 길이를 기록해서
  // 마지막 5bit 패딩을 정확하게 제거할 수 있게 함.
  const all = Uint8Array.from([payload.length, ...payload]);
  return bytesTo5(all).map(v => TOKENS[v]).join(" ");
}

function dec(encoded){
  const parts = encoded.trim().split(/\s+/).filter(Boolean);

  if(!parts.length) return "";

  const values = parts.map(t=>{
    const v = REV.get(t);
    if(v === undefined){
      throw Error("등록되지 않은 우사기 언어가 있어.");
    }
    return v;
  });

  // 먼저 전체를 충분히 바이트로 풀어서 길이 헤더를 확인.
  const maxByteLength = Math.floor(values.length * 5 / 8);
  if(maxByteLength < 1) throw Error("우사기 언어가 너무 짧아.");

  const rough = fiveToBytes(values, maxByteLength);
  const payloadLength = rough[0];

  if(payloadLength + 1 > rough.length){
    throw Error("우사기 언어가 손상됐어.");
  }

  return td.decode(rough.slice(1, 1 + payloadLength));
}

let mode="encode";
const $=x=>document.getElementById(x),
      input=$("input"),
      output=$("output"),
      status=$("status"),
      counter=$("counter");

function setMode(m){
  mode=m;
  document.querySelectorAll(".tab").forEach(x=>
    x.classList.toggle("active", x.dataset.mode===m)
  );

  if(m==="encode"){
    input.maxLength=40;
    input.placeholder="메시지를 입력해줘";
    $("inputLabel").textContent="메시지";
    $("outputLabel").textContent="우사기 언어";
    $("go").textContent="우사기 언어로 바꾸기";
    $("countWrap").style.display="block";
  }else{
    input.removeAttribute("maxlength");
    input.placeholder="우사기 언어를 붙여넣어";
    $("inputLabel").textContent="우사기 언어";
    $("outputLabel").textContent="사람 언어";
    $("go").textContent="사람 언어로 바꾸기";
    $("countWrap").style.display="none";
  }

  output.value="";
  status.textContent="";
}

document.querySelectorAll(".tab").forEach(x=>
  x.onclick=()=>setMode(x.dataset.mode)
);

input.oninput=()=>{
  if(mode==="encode"){
    const chars=[...input.value];
    if(chars.length>40){
      input.value=chars.slice(0,40).join("");
    }
    counter.textContent=[...input.value].length;
  }
};

$("go").onclick=()=>{
  try{
    if(mode==="encode"){
      output.value=enc(input.value);
      const tokenCount=output.value ? output.value.split(/\s+/).length : 0;
      status.textContent=`우사기 언어로 바꿨어! · ${tokenCount}토큰`;
    }else{
      output.value=dec(input.value);
      status.textContent="사람 언어로 바꿨어!";
    }
  }catch(e){
    status.textContent="오류: "+e.message;
  }
};

$("copy").onclick=async()=>{
  if(!output.value) return status.textContent="복사할 결과가 없어.";

  try{
    await navigator.clipboard.writeText(output.value);
    status.textContent="복사했어!";
  }catch{
    output.select();
    document.execCommand("copy");
    status.textContent="복사했어!";
  }
};

$("swap").onclick=()=>{
  if(!output.value)return;

  const v=output.value;
  setMode(mode==="encode" ? "decode" : "encode");
  input.value=v;

  if(mode==="encode"){
    counter.textContent=[...input.value].length;
  }
};

$("example").onclick=()=>{
  input.value = mode==="encode"
    ? "오늘 뭐해?"
    : enc("내일 보자!");

  if(mode==="encode"){
    counter.textContent=[...input.value].length;
  }
};

$("clear").onclick=()=>{
  input.value="";
  output.value="";
  status.textContent="";
  counter.textContent="0";
};

// 기본 왕복 검증
[
  "오늘 뭐해?",
  "렌더링 테스트가 뭐야?",
  "Hello!",
  "日本語テスト",
  "우사기🐰"
].forEach(s=>{
  if(dec(enc(s))!==s){
    throw Error("우사기 언어 self-test 실패: "+s);
  }
});
</script></body></html>
