const REV=new Map(TOKENS.map((t,i)=>[t,i]));
const DICT=["오늘", "내일", "지금", "점심", "저녁", "출근", "퇴근", "야근", "회사", "회의", "업무", "마감", "일정", "휴가", "연차", "학교", "수업", "과제", "시험", "공부", "도서관", "조별과제", "카페", "지하철", "버스", "밥 먹자", "뭐 먹지", "배고파", "커피", "뭐해", "뭐 해", "어디야", "어디야?", "만나자", "보자", "가자", "갈까", "연락해", "기다려", "좋아", "싫어", "귀찮아", "피곤해", "졸려", "힘들어", "대박", "헐", "진짜", "고마워", "미안", "괜찮아", "사랑해", "잘자", "안녕", "ㅋㅋ", "ㅋㅋㅋ", "ㅋㅋㅋㅋ", "ㅎㅎ", "ㅠㅠ", "ㅜㅜ", "ㅇㅇ", "ㄴㄴ", "ㄱㄱ", "오케이", "ㅇㅋ", "퇴근하고", "수업 끝나고", "회의 끝나고", "시험 끝나고", "집에 가자", "집에 가고 싶다", "일하기 싫다", "오늘 뭐해", "내일 뭐해", "지금 어디야", "점심 먹자", "저녁 먹자", "퇴근하면", "도착하면", "연락줘", "곧 도착", "지금 출발", "주말에 뭐해", "이번 주", "다음 주", "수고했어", "감사합니다", "퇴근하자", "공부하기 싫다", "시험 망했다", "과제 하기 싫다", "집 가고 싶다", "밥 먹었어", "밥 먹었어?", "한잔 할래"];
const DREV=new Map(DICT.map((w,i)=>[w,i]));
const SDICT=[...DICT].sort((a,b)=>b.length-a.length);

// 0..127 ASCII direct
// 128..171 Hangul page prefix
// 172..253 dictionary prefix
// 254 arbitrary Unicode escape
// 255 reserved
function encodeCodes(text){
  const out=[];
  let i=0;
  while(i<text.length){
    let found=null;
    for(const w of SDICT){
      if(text.startsWith(w,i)){found=w;break;}
    }
    if(found){
      const di=DREV.get(found);
      out.push(172+Math.floor(di/256), di%256);
      i+=found.length;
      continue;
    }

    const cp=text.codePointAt(i);
    const ch=String.fromCodePoint(cp);

    if(cp<=127){
      out.push(cp);
    } else if(cp>=0xAC00 && cp<=0xD7A3){
      const idx=cp-0xAC00;
      out.push(128+Math.floor(idx/256), idx%256);
    } else {
      out.push(254,(cp>>16)&255,(cp>>8)&255,cp&255);
    }
    i+=ch.length;
  }
  return out;
}

function enc(text){
  return encodeCodes(text).map(c=>TOKENS[c]).join(" ");
}

function dec(encoded){
  const parts=encoded.trim().split(/\s+/).filter(Boolean);
  let out="";
  for(let i=0;i<parts.length;i++){
    const c=REV.get(parts[i]);
    if(c===undefined) throw Error("알 수 없는 우사기 언어가 있어.");

    if(c<=127){
      out+=String.fromCharCode(c);
    } else if(c>=128 && c<=171){
      if(i+1>=parts.length) throw Error("한글 코드가 중간에 끊겼어.");
      const lo=REV.get(parts[++i]);
      if(lo===undefined) throw Error("한글 코드가 올바르지 않아.");
      const idx=(c-128)*256+lo;
      if(idx>=11172) throw Error("잘못된 한글 코드야.");
      out+=String.fromCharCode(0xAC00+idx);
    } else if(c>=172 && c<=253){
      if(i+1>=parts.length) throw Error("단어 코드가 중간에 끊겼어.");
      const lo=REV.get(parts[++i]);
      if(lo===undefined) throw Error("단어 코드가 올바르지 않아.");
      const di=(c-172)*256+lo;
      if(di>=DICT.length) throw Error("등록되지 않은 단어 코드야.");
      out+=DICT[di];
    } else if(c===254){
      if(i+3>=parts.length) throw Error("특수문자 코드가 중간에 끊겼어.");
      const a=REV.get(parts[++i]),b=REV.get(parts[++i]),d=REV.get(parts[++i]);
      if(a===undefined||b===undefined||d===undefined) throw Error("특수문자 코드가 올바르지 않아.");
      out+=String.fromCodePoint((a<<16)|(b<<8)|d);
    } else {
      throw Error("예약된 코드야.");
    }
  }
  return out;
}

let mode="encode";
const $=x=>document.getElementById(x),input=$("input"),output=$("output"),status=$("status"),counter=$("counter"),stats=$("stats");
function setMode(m){
  mode=m;
  document.querySelectorAll(".tab").forEach(x=>x.classList.toggle("active",x.dataset.mode===m));
  if(m==="encode"){
    input.maxLength=40;input.placeholder="메시지를 입력해줘";
    $("inputLabel").textContent="메시지";$("outputLabel").textContent="우사기 언어";
    $("go").textContent="우사기 언어로 바꾸기";$("countWrap").style.display="block";
  }else{
    input.removeAttribute("maxlength");input.placeholder="우사기 언어를 붙여넣어";
    $("inputLabel").textContent="우사기 언어";$("outputLabel").textContent="사람 언어";
    $("go").textContent="사람 언어로 바꾸기";$("countWrap").style.display="none";
  }
  output.value="";status.textContent="";if(stats)stats.innerHTML="";
}
document.querySelectorAll(".tab").forEach(x=>x.onclick=()=>setMode(x.dataset.mode));
input.oninput=()=>counter.textContent=[...input.value].length;
$("go").onclick=()=>{
  try{
    if(mode==="encode"){
      const c=encodeCodes(input.value);
      output.value=c.map(x=>TOKENS[x]).join(" ");
      status.textContent="우사기 언어로 바꿨어!";
      if(stats)stats.innerHTML=`<span class="badge">출력 토큰 ${c.length}개</span><span class="badge">말투 토큰 256개</span>`;
    }else{
      output.value=dec(input.value);
      status.textContent="사람 언어로 바꿨어!";
    }
  }catch(e){status.textContent="오류: "+e.message}
};
$("copy").onclick=async()=>{
  if(!output.value)return status.textContent="복사할 결과가 없어.";
  try{await navigator.clipboard.writeText(output.value);status.textContent="복사했어!"}catch{status.textContent="복사 실패"}
};
$("swap").onclick=()=>{
  if(!output.value)return;
  const v=output.value;setMode(mode==="encode"?"decode":"encode");input.value=v;
};
$("example").onclick=()=>{
  input.value=mode==="encode"?"오늘 퇴근하면 저녁 먹자 ㅋㅋ":enc("내일 수업 끝나고 카페 갈래?");
  counter.textContent=[...input.value].length;
};
$("clear").onclick=()=>{
  input.value="";output.value="";status.textContent="";counter.textContent="0";if(stats)stats.innerHTML="";
};
